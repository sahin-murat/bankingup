services:
  gateway:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://bankingup:bankingup@postgres:5432/bankingup?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: docker.io/library/postgres:18.6-alpine3.24
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: bankingup
      POSTGRES_USER: bankingup
      POSTGRES_PASSWORD: bankingup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankingup -d bankingup"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
